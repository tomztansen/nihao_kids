name: Build NiHao Kids (APK & AAB)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Configure Android Project Template
        run: |
          mkdir -p /tmp/android_backup
          cp android/app/src/main/AndroidManifest.xml /tmp/android_backup/AndroidManifest.xml
          cp -r android/app/src/main/res /tmp/android_backup/res
          if [ -f android/key.properties ]; then
            cp android/key.properties /tmp/android_backup/key.properties
          fi
          if [ -f android/upload-keystore.jks ]; then
            cp android/upload-keystore.jks /tmp/android_backup/upload-keystore.jks
          fi

          flutter create --platforms=android --org com.example .

          cp /tmp/android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r /tmp/android_backup/res/* android/app/src/main/res/
          if [ -f /tmp/android_backup/key.properties ]; then
            cp /tmp/android_backup/key.properties android/key.properties
          fi
          if [ -f /tmp/android_backup/upload-keystore.jks ]; then
            cp /tmp/android_backup/upload-keystore.jks android/upload-keystore.jks
          fi

          sed -i -E 's/id "org\.jetbrains\.kotlin\.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "2.1.0"/' android/settings.gradle || true
          if [ -f android/build.gradle ]; then
            sed -i -E "s/ext\.kotlin_version = '[^']+'/ext.kotlin_version = '2.1.0'/" android/build.gradle || true
          fi

          python3 tools/configure_signing.py

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal Release APK (For Direct Phone Install)
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB for Google Play Store)
        run: flutter build appbundle --release

      - name: Upload APK Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NiHao-Kids-Installable-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload Google Play AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NiHao-Kids-GooglePlay-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Publish Direct Download to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "NiHao Kids Android APK (Latest)"
          body: "Versi rilis terbaru NiHao Kids APK untuk dipasang langsung di HP Android."
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version.json ONLY AFTER APK is successfully uploaded
        if: github.ref == 'refs/heads/main'
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | tr -d '[:space:]')
          BUILD_NUM=$(grep '^version:' pubspec.yaml | sed 's/.*+//' | tr -d '[:space:]')
          echo "Updating version.json to v$VERSION (Build $BUILD_NUM) after confirmed APK release..."
          cat <<EOF > version.json
{
  "latest_version": "$VERSION",
  "latest_build_number": $BUILD_NUM,
  "min_required_version": "$VERSION",
  "min_required_build_number": $BUILD_NUM,
  "force_update": true,
  "release_date": "$(date +%Y-%m-%d)",
  "title": "Pembaruan Resmi v$VERSION Tersedia! 🐼🚀",
  "title_en": "Official Update v$VERSION Available! 🐼🚀",
  "message": "Pembaruan v$VERSION telah dirilis dan siap dipasang langsung di dalam aplikasi.",
  "message_en": "Version v$VERSION is available and ready to update directly inside the app.",
  "apk_download_url": "https://github.com/tomztansen/nihao_kids/releases/latest/download/app-release.apk",
  "web_download_page": "https://tomztansen.github.io/nihao_kids/download.html"
}
EOF
          cp version.json preview/version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json preview/version.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(release): publish version.json v$VERSION+$BUILD_NUM [skip ci]"
            git push origin main
            echo "✅ version.json successfully published to GitHub Pages!"
          else
            echo "ℹ️ version.json already up-to-date."
          fi
